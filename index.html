<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gingham Diary – Birthday</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Pacifico&family=Sacramento&display=swap">
<style>
:root{--a:#f06292;--g:color-mix(in srgb,var(--a) 22%,transparent);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background-color:#fff;background-image:linear-gradient(90deg,var(--g) 50%,transparent 50%),linear-gradient(var(--g) 50%,transparent 50%);background-size:28px 28px;font-family:Caveat,"Segoe Script",cursive;color:#5b2a3c;overflow:hidden}
#app{position:fixed;inset:0;padding-top:env(safe-area-inset-top,0px)}
.sc{position:absolute;inset:0 0 64px;padding:18px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;animation:in .6s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateX(60px) scale(.96)}}
.ttl{font-family:Pacifico,cursive;color:var(--a);font-size:34px;line-height:1.2;margin:0 0 8px;text-shadow:2px 2px 0 #fff}
.card{background:rgba(255,255,255,.93);border:2px solid color-mix(in srgb,var(--a) 40%,#fff);border-radius:18px;padding:16px 18px;box-shadow:5px 5px 0 var(--g);font-size:22px;line-height:1.25;max-width:420px;width:100%;position:relative}
.hp{background:color-mix(in srgb,var(--a) 25%,#fff) center/cover;clip-path:url(#hc);aspect-ratio:1;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px;width:100%;max-width:340px}
.hg small{display:block;font-size:21px;margin-top:-6px;color:var(--a)}
.pol{background:#fff;padding:6px 6px 14px;box-shadow:0 6px 14px rgba(0,0,0,.2);transform:rotate(var(--r));cursor:pointer;position:relative}
.pol .ph{aspect-ratio:1;background:color-mix(in srgb,var(--a) 22%,#fff) center/cover;display:flex;align-items:center;justify-content:center;color:#fff}
.tape{position:absolute;top:-9px;left:50%;margin-left:-26px;width:52px;height:16px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 5px,transparent 5px 10px),color-mix(in srgb,var(--a) 40%,#fff);opacity:.9}
.btn{background:var(--a);color:#fff;border:0;border-radius:999px;padding:8px 22px;font:700 22px Caveat,cursive;box-shadow:0 4px 0 color-mix(in srgb,var(--a) 70%,#000);cursor:pointer;margin-top:12px}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.o{background:#fff;color:var(--a);box-shadow:0 4px 0 var(--g);border:2px solid var(--a)}
.st{position:absolute;fill:currentColor;color:var(--a);animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(7deg)}}
.fr{width:170px;height:170px;border-radius:50%;border:9px dotted var(--a);background:#fff center/cover;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer;margin-bottom:10px}
.gd i{display:inline-block;width:18px;height:18px;border-radius:5px;border:2px solid var(--a);margin:0 5px}
.gd i.on{background:var(--a)}
.kp{display:grid;grid-template-columns:repeat(3,62px);gap:10px;margin-top:12px}
.kp button{height:56px;border-radius:50%;border:0;background:var(--a);color:#fff;font:700 26px Caveat,cursive;box-shadow:0 4px 0 color-mix(in srgb,var(--a) 70%,#000)}
.kp button:active{transform:translateY(3px);box-shadow:none}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.w{opacity:0;display:inline-block;animation:wi .6s forwards}@keyframes wi{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.fl{transform-box:fill-box;transform-origin:50% 100%;animation:fk .5s ease-in-out infinite alternate}@keyframes fk{to{transform:scale(.88,1.1) rotate(4deg)}}
.out .fl{opacity:0;transform:scale(0);animation:none;transition:.5s}
.sway{transform-origin:50% 100%;animation:sw 3.5s ease-in-out infinite}@keyframes sw{50%{transform:rotate(2.5deg)}}
.spin{animation:spin 3s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.ly{font-size:23px;opacity:.45;transition:.4s;margin:3px 0}.ly.on{opacity:1;color:var(--a);transform:scale(1.08)}
.cat{overflow:visible;cursor:pointer;position:absolute;filter:drop-shadow(0 3px 3px rgba(0,0,0,.18))}
.cbd{transform-box:fill-box;transform-origin:50% 100%;animation:br 3s ease-in-out infinite}@keyframes br{50%{transform:scale(1.04,.96)}}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}@keyframes wag{50%{transform:rotate(16deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:bl 4.5s infinite}@keyframes bl{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:tw 6s infinite}@keyframes tw{0%,88%,100%{transform:rotate(0)}92%{transform:rotate(-9deg)}}
.cf2{position:absolute;top:-16px;width:9px;height:14px;z-index:6;animation:cf 2.8s ease-in forwards;pointer-events:none}@keyframes cf{to{transform:translateY(900px) rotate(720deg);opacity:0}}
.fh{position:fixed;z-index:20;color:var(--a);font-size:26px;pointer-events:none;animation:fh 1.3s ease-out forwards}@keyframes fh{to{transform:translateY(-70px) scale(1.6);opacity:0}}
#amb{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.78),transparent 62%)}
#app{z-index:1}
.bh{position:absolute;bottom:-70px;fill:color-mix(in srgb,var(--a) 30%,#fff);stroke:rgba(255,255,255,.9);stroke-width:.7;animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx),-118vh) rotate(var(--rot))}}
.sp{position:absolute;fill:#fff;filter:drop-shadow(0 0 4px #fff);animation:tw2 2.4s ease-in-out infinite}
@keyframes tw2{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}
.tl{position:absolute;inset:0}
.dt{position:absolute;top:12px;right:16px;font:600 14px system-ui;text-align:right;letter-spacing:.4px;color:#5b2a3c}
.hy{position:absolute;left:7%;top:20%;font:min(16vw,84px) Sacramento,cursive;color:color-mix(in srgb,var(--a) 65%,#000);animation:wi 1s .1s backwards}
.bt{position:absolute;left:0;right:0;top:30%;display:flex;justify-content:center;font:900 min(17vw,96px)/1 'Arial Black',Impact,system-ui,sans-serif}
.bd{display:inline-block;background:linear-gradient(180deg,var(--a),color-mix(in srgb,var(--a) 55%,#000));-webkit-background-clip:text;background-clip:text;color:transparent;animation:rv .8s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes rv{from{opacity:0;transform:translateY(45%) scale(.8);filter:blur(6px)}}
.pp{position:absolute;left:50%;bottom:4%;width:64%;height:70%;transform:translateX(-50%);background:center bottom/contain no-repeat;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;line-height:1.1;color:#fff;cursor:pointer;animation:ps 1s .7s backwards cubic-bezier(.2,.8,.2,1)}
.pp small{font-size:15px}
@keyframes ps{from{opacity:0;transform:translateX(-50%) translateY(40px)}}
.pp.fm{background-size:cover;background-position:center;border-radius:999px 999px 18px 18px;border:6px solid #fff;box-shadow:0 12px 28px rgba(0,0,0,.25);background-color:color-mix(in srgb,var(--a) 30%,#fff);width:58%;height:60%}
.nm{position:absolute;right:7%;bottom:7%;font:600 15px system-ui;z-index:3;color:#5b2a3c}
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;align-items:center;justify-content:center;gap:14px;transition:opacity .5s}
#bar button{background:none;border:0;font-size:32px;color:var(--a);padding:0 10px}
/* Big, friendly page navigation on every unlocked screen */
#nextCute{position:fixed;right:16px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;min-width:154px;height:60px;padding:0 15px;border:3px solid #fff;border-radius:999px;background:linear-gradient(135deg,#ff8fba,#e84f91);color:#fff;font:700 21px Caveat,cursive;letter-spacing:.2px;box-shadow:0 6px 0 #c94a7c,0 9px 20px rgba(166,55,100,.24);display:none;align-items:center;justify-content:center;gap:7px;cursor:pointer;animation:nextFloat 2.4s ease-in-out infinite}
#nextCute:active{transform:translateY(4px);box-shadow:0 2px 0 #c94a7c,0 5px 12px rgba(166,55,100,.2)}
#nextCute .arr{font:700 23px system-ui;line-height:1}
#nextCute .kitten{width:39px;height:39px;flex:none;overflow:visible;animation:kittyHop 1.25s ease-in-out infinite}
#nextCute .kitty-tail{transform-box:fill-box;transform-origin:8% 85%;animation:kittyTail .8s ease-in-out infinite alternate}
#nextCute .kitty-eye{transform-box:fill-box;transform-origin:center;animation:kittyBlink 4s infinite}
@keyframes kittyHop{0%,100%{transform:translateY(1px) rotate(-3deg)}50%{transform:translateY(-5px) rotate(4deg)}}
@keyframes kittyTail{to{transform:rotate(22deg)}}
@keyframes kittyBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes nextFloat{0%,100%{translate:0 0}50%{translate:0 -5px}}
@media(max-height:620px){#nextCute{height:50px;min-width:138px;font-size:18px;bottom:calc(8px + env(safe-area-inset-bottom,0px))}#nextCute .kitten{width:33px;height:33px}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--a);opacity:.3;display:inline-block;margin:0 3px;transition:.3s}.dot.on{opacity:1;transform:scale(1.5)}
.ib{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;width:42px;height:42px;border-radius:50%;border:0;background:#fff;color:var(--a);box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:7;font-size:19px}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:82%;overflow:auto;background:#fffafb;color:#5b2a3c;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(110%);transition:transform .35s;z-index:8;box-shadow:0 -8px 30px rgba(0,0,0,.3);font:15px system-ui,sans-serif}
#sheet.open{transform:none}
#sheet input,#sheet textarea{width:100%;padding:9px;border:1px solid #f0cbd6;border-radius:10px;background:#fff;color:#5b2a3c;font:inherit;margin:3px 0 10px}
#sheet label{font-size:13px;color:#8a6f75}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;margin:3px 6px 10px 0;border:3px solid #fff;box-shadow:0 0 0 1px #ccc}

/* Premium camera and birthday-page animations */
.camera-heart{position:relative;isolation:isolate;overflow:visible!important;cursor:pointer}
.camera-art{width:clamp(118px,36vw,166px);height:auto;filter:drop-shadow(0 13px 13px rgba(156,49,91,.24));animation:cameraFloat 3.4s ease-in-out infinite;transform-origin:50% 60%}
.camera-art .cam-lens{transform-origin:50% 50%;animation:lensShimmer 3s ease-in-out infinite}
.camera-art .cam-glint{animation:glint 3.4s ease-in-out infinite}
.camera-heart:active .camera-art{transform:scale(.94) rotate(-4deg)}
.camera-hint{position:absolute;left:50%;bottom:13%;transform:translateX(-50%);white-space:nowrap;background:rgba(255,255,255,.92);border:1px solid rgba(240,98,146,.25);border-radius:999px;padding:5px 12px;color:#a33d66;font:600 13px system-ui,sans-serif;box-shadow:0 3px 10px rgba(156,49,91,.10)}
.camera-flash{position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;pointer-events:none;z-index:5}
.camera-heart.flash-now .camera-flash{animation:cameraFlash .55s ease-out}
.birthday-title{filter:drop-shadow(0 5px 0 rgba(255,255,255,.9));animation:titlePop .9s cubic-bezier(.2,.8,.2,1) both}
.birthday-copy{box-shadow:0 12px 28px rgba(190,91,127,.12),inset 0 0 0 1px rgba(255,255,255,.7)}
@keyframes cameraFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes lensShimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}
@keyframes glint{0%,72%,100%{opacity:.35}80%{opacity:1}}
@keyframes cameraFlash{0%{opacity:0}18%{opacity:.95}100%{opacity:0}}
@keyframes titlePop{0%{opacity:0;transform:translateY(18px) scale(.88)}70%{transform:translateY(-3px) scale(1.03)}100%{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.camera-art,.camera-art .cam-lens,.birthday-title{animation:none!important}}


/* User-requested bouquet, animated pets, photo slot and realistic cherries */
.cat{animation:catHop 3.8s ease-in-out infinite}
.cat:nth-of-type(2){animation-delay:1.1s}
.cat .cbd{animation-duration:2.1s}
.cat .tail{animation-duration:1.05s}
.cat .ear{animation-duration:4.2s}
@keyframes catHop{0%,72%,100%{transform:translateY(0) rotate(0)}78%{transform:translateY(-11px) rotate(-4deg)}84%{transform:translateY(0) rotate(3deg)}90%{transform:translateY(-4px)}}
.bouquet{width:min(88vw,340px);height:auto;overflow:visible;filter:drop-shadow(0 12px 12px rgba(140,75,88,.16))}
.bouquet .stem{fill:none;stroke:#578e64;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.bouquet .leaf{transform-box:fill-box;transform-origin:bottom center;animation:leafSway 4s ease-in-out infinite}
.bouquet .bloom{transform-box:fill-box;transform-origin:50% 70%;animation:bloomSway 3.8s ease-in-out infinite}
.bouquet .bloom:nth-of-type(2n){animation-delay:.5s}
.bouquet .petal{stroke:rgba(255,255,255,.55);stroke-width:1.2}
.bouquet-wrap{fill:url(#wrapGrad);stroke:#e78baa;stroke-width:2}
.bouquet-ribbon{fill:#e95d94;stroke:#fff0f6;stroke-width:2}
@keyframes leafSway{50%{transform:rotate(5deg)}}
@keyframes bloomSway{50%{transform:rotate(3deg) translateY(-3px)}}
.photo-message-upload{width:min(100%,300px);height:112px;margin:0 auto 12px;border:2px dashed rgba(225,91,143,.48);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,232,241,.92));box-shadow:0 7px 18px rgba(190,91,127,.10);display:flex;align-items:center;justify-content:center;gap:10px;overflow:hidden;cursor:pointer;position:relative;background-position:center;background-size:cover}
.photo-message-upload.has-photo:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(67,28,48,.35),transparent 55%)}
.photo-message-upload .upload-label{z-index:1;background:rgba(255,255,255,.9);border-radius:999px;padding:6px 12px;color:#a33d66;font:600 13px system-ui,sans-serif}
.photo-message-upload .upload-icon{font-size:28px;color:#e45f94;z-index:1}
.berry-art{position:absolute;overflow:visible;filter:drop-shadow(0 7px 7px rgba(110,40,54,.2));animation:berryBob 4.2s ease-in-out infinite}
.berry-art .berry-shine{animation:berryShine 3.5s ease-in-out infinite}
@keyframes berryBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(3deg)}}
@keyframes berryShine{0%,100%{opacity:.55}50%{opacity:.95}}
@media(prefers-reduced-motion:reduce){.cat,.bouquet .leaf,.bouquet .bloom,.berry-art{animation:none!important}}


/* Premium storybook artwork pass */
#cake{width:min(86vw,350px);height:auto;overflow:visible;filter:drop-shadow(0 18px 18px rgba(111,51,75,.18));animation:cakeRise 1s cubic-bezier(.2,.8,.2,1) both}
#cake .cake-tier{filter:drop-shadow(0 5px 3px rgba(155,75,105,.12))}
#cake .fl{transform-box:fill-box;transform-origin:50% 100%;animation:candleDance .42s ease-in-out infinite alternate}
#cake .fl:nth-of-type(2n){animation-delay:.17s}
#cake .flame-core{animation:flameGlow .7s ease-in-out infinite alternate}
#cake .cake-sparkle{animation:sparklePulse 1.8s ease-in-out infinite}
#cake .cake-berry{filter:drop-shadow(0 2px 2px rgba(125,20,52,.22))}
.bouquet{width:min(94vw,390px);height:auto;filter:drop-shadow(0 18px 16px rgba(119,57,83,.18));animation:bouquetAppear 1.1s cubic-bezier(.2,.8,.2,1) both}
.bouquet .bloom{transform-box:fill-box;transform-origin:50% 78%;animation:flowerDance 4.5s ease-in-out infinite}
.bouquet .bloom:nth-child(2n){animation-delay:.6s}
.bouquet .petal{stroke:rgba(255,255,255,.7);stroke-width:1.5}
.bouquet .leaf{transform-box:fill-box;transform-origin:bottom center;animation:leafSway 4s ease-in-out infinite}
.bouquet .paper-back{filter:drop-shadow(0 5px 4px rgba(139,69,92,.12))}
.cat{animation:catHop 3.2s ease-in-out infinite;transform-origin:50% 85%}
.cat:nth-of-type(2n){animation-delay:1.2s}
@keyframes cakeRise{from{opacity:0;transform:translateY(24px) scale(.88)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes candleDance{to{transform:scale(.86,1.13) rotate(5deg)}}
@keyframes flameGlow{to{filter:drop-shadow(0 0 8px #ffb43c);opacity:.82}}
@keyframes sparklePulse{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes flowerDance{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg) translateY(-4px)}}
@keyframes bouquetAppear{from{opacity:0;transform:translateY(26px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){#cake,.bouquet,.bouquet .bloom,.cat{animation:none!important}}


/* V4: cinematic storybook polish */
.sc{animation:cinematicEnter .82s cubic-bezier(.18,.78,.22,1) both}
@keyframes cinematicEnter{0%{opacity:0;transform:translateY(22px) scale(.975);filter:blur(5px)}100%{opacity:1;transform:translateY(0) scale(1);filter:blur(0)}}
#cake{width:min(94vw,410px);filter:drop-shadow(0 24px 20px rgba(111,51,75,.22));}
#cake .cake-tier{filter:drop-shadow(0 7px 5px rgba(115,47,77,.17))}
#cake .cake-berry{transform-box:fill-box;transform-origin:center;animation:berryPop .75s cubic-bezier(.2,.9,.25,1.3) both}
#cake .cake-berry:nth-of-type(2){animation-delay:.18s}
@keyframes berryPop{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:scale(1)}}
#cake .cake-icing{filter:drop-shadow(0 2px 1px rgba(180,92,126,.15))}
#cake .fl{filter:drop-shadow(0 0 7px rgba(255,173,54,.7))}
#cake.out{animation:cakeWish .8s ease both}
@keyframes cakeWish{35%{transform:scale(1.04) rotate(-1deg)}100%{transform:scale(.94);opacity:.9}}
/* Bouquet blossoms unfold one by one */
.bouquet .bloom{transform-box:fill-box;transform-origin:50% 65%}
.bouquet .petal{transform-box:fill-box;transform-origin:50% 100%;animation:petalUnfold .9s cubic-bezier(.16,.9,.24,1.2) both}
.bouquet .bloom:nth-of-type(1) .petal{animation-delay:.08s}
.bouquet .bloom:nth-of-type(2) .petal{animation-delay:.22s}
.bouquet .bloom:nth-of-type(3) .petal{animation-delay:.36s}
.bouquet .bloom:nth-of-type(4) .petal{animation-delay:.5s}
.bouquet .bloom:nth-of-type(5) .petal{animation-delay:.64s}
.bouquet .bloom:nth-of-type(6) .petal{animation-delay:.78s}
@keyframes petalUnfold{0%{opacity:.1;transform:scale(.05) rotate(-18deg)}75%{opacity:1;transform:scale(1.12) rotate(3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
.bouquet .bloom{animation:flowerDance 4.2s ease-in-out 1s infinite}
.bouquet .paper-back{filter:drop-shadow(0 12px 8px rgba(139,69,92,.18))}
.bouquet{width:min(98vw,420px);filter:drop-shadow(0 20px 18px rgba(119,57,83,.22))}
.cat{animation:kittyBounce 2.8s ease-in-out infinite;filter:drop-shadow(0 7px 5px rgba(80,45,55,.2))}
.cat .tail{animation:kittyTail .85s ease-in-out infinite alternate;transform-origin:72px 88px}
.cat .ear{animation:kittyEar 5s ease-in-out infinite}
.cat .eye{animation:kittyBlink 4s infinite}
@keyframes kittyBounce{0%,100%{translate:0 0;rotate:0deg}45%{translate:0 -8px;rotate:-2deg}55%{translate:0 -8px;rotate:2deg}}
@keyframes kittyTail{to{transform:rotate(24deg)}}
@keyframes kittyEar{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}}
@keyframes kittyBlink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.pol{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}
.pol:hover{transform:rotate(0) translateY(-7px) scale(1.035);box-shadow:0 16px 25px rgba(80,35,55,.2)}
.pol .ph{transition:filter .5s,transform .5s}
.pol:active .ph{filter:brightness(1.12);transform:scale(.97)}
/* Music screen as a soft luxury player */
.music-shell{width:min(92vw,370px);padding:20px 20px 18px;border-radius:28px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(255,235,243,.94));border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 40px rgba(139,57,91,.18),inset 0 1px 0 #fff}
.music-cover{width:174px;height:174px;border-radius:24px;margin:12px auto 16px;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#fff9fc,#f5b4cd 52%,#d95d91);box-shadow:0 12px 24px rgba(139,57,91,.2);position:relative;overflow:hidden}
.music-cover:before,.music-cover:after{content:"";position:absolute;width:180%;height:1px;background:rgba(255,255,255,.42);transform:rotate(-35deg)}
.music-cover:after{transform:rotate(35deg)}
.music-cover .vinyl{width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,#f9c8da 0 10%,#fff 10% 13%,#34232b 14% 17%,#18151a 18% 58%,#4b3540 59% 61%,#17151a 62%);box-shadow:0 8px 18px rgba(49,23,35,.35);display:grid;place-items:center;z-index:1}
